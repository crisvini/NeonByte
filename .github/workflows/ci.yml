name: Validate NeonByte

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-startup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Run isolated Windows startup launcher regression
        run: npm test

  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix agent
      - run: npm run check
      - name: Run PC-only end-to-end validation
        run: npm run test:offline

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - name: Run native firmware tests
        run: pio test -d firmware -e native
      - name: Compile provisional ESP8266 profile
        run: pio run -d firmware -e esp8266-provisional
      - name: Compile enabled ESP8266 validation profile
        run: pio run -d firmware -e esp8266-integration-check
      - name: Probe pinned display and recovery adapters offline
        run: python firmware/scripts/probe_compatibility.py
      - name: Probe pinned RGB565 SPI byte order offline
        run: python firmware/scripts/probe_display_colors.py
      - name: Probe stock restoration HTTP admission offline
        run: python firmware/scripts/probe_stock_http.py
      - name: Probe HTTP connection lifecycle offline
        run: python firmware/scripts/probe_http_lifecycle.py
      - name: Probe authenticated HTTP diagnostics offline
        run: python firmware/scripts/probe_http_diagnostics.py
      - name: Probe NBIF v2 upload, validation, and replacement offline
        run: python firmware/scripts/probe_animation_v2_http.py
      - name: Validate local images and deployment guard
        run: |
          python firmware/scripts/test_local_build_guard.py
          c++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include firmware/scripts/validate_image.cpp firmware/src/firmware_image.cpp -o /tmp/neonbyte-image-validator
          python firmware/scripts/inspect_image.py firmware/.pio/build/esp8266-provisional/firmware.bin
          python firmware/scripts/inspect_image.py firmware/.pio/build/esp8266-integration-check/firmware.bin
          /tmp/neonbyte-image-validator firmware/.pio/build/esp8266-provisional/firmware.bin
          /tmp/neonbyte-image-validator firmware/.pio/build/esp8266-integration-check/firmware.bin
