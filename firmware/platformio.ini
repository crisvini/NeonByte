[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -Werror -Iinclude
test_build_src = yes

; Compilation profile only. Physical capacity and peripheral wiring are unverified.
[env:esp8266-provisional]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.ldscript = eagle.flash.4m3m.ld
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
build_flags =
    -Iprivate
    -std=gnu++17
    -Wall
    -Wextra
    -fstack-usage
    -DNEONBYTE_ENABLE_DISPLAY=0
    -DNEONBYTE_ENABLE_OTA=0
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit BusIO@1.17.0
extra_scripts = pre:scripts/local_build_only.py

; Exercises the gated code for local compiler/size validation only.
[env:esp8266-integration-check]
extends = env:esp8266-provisional
build_flags =
    -Iprivate
    -std=gnu++17
    -Wall
    -Wextra
    -fstack-usage
    -DNEONBYTE_ENABLE_DISPLAY=1
    -DNEONBYTE_ENABLE_OTA=1
